<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile Settings</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="profile-card" id="card">
    <p class="tag">Profile Settings</p>
    <h1>User Profile</h1>
    <p id="welcome">Welcome, Guest!</p>

    <label for="userName">Your Name</label>
    <input id="userName" type="text" placeholder="Enter your name">

    <button id="confirmBtn">Confirm</button>
    <p id="status">Changes are not saved</p>

    <label for="themeSelect">Color Theme</label>
    <select id="themeSelect">
        <option value="light">Light theme</option>
        <option value="dark">Dark theme</option>
    </select>

    <button id="detailBtn" class="secondary">Show additional information</button>
    <p class="hidden" id="details">Your account has been successfully activated, here you can manage your data.</p>
</main>

<script src="script.js" defer></script>
</body>
</html>
